<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none"><title>ChemKit Catalyst Hexagon</title>
  
  <!-- Left facet forming the 'C' (Carbon / Chem) -->
  <path d="M 128 32 L 44.86 80 L 44.86 176 L 128 224" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Central spine and diagonal arms forming the 'K' (Kit / Kinetic) -->
  <line x1="128" y1="52" x2="128" y2="204" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
  <line x1="128" y1="128" x2="211.14" y2="80" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
  <line x1="128" y1="128" x2="211.14" y2="176" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
  <!-- Central Catalytic Prism Core -->
  <circle cx="128" cy="128" r="18" fill="#ffffff" />
</svg>
