<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none"><title>ChemKit Brand Symbol</title>
  
  <!-- Central Carbon Nucleus -->
  <circle cx="128" cy="128" r="28" fill="#38d9e8" />
  <!-- Three Orbital Ellipses rotated at 0, 60, 120 deg -->
  <ellipse cx="128" cy="128" rx="98" ry="40" stroke="#38d9e8" stroke-width="14" />
  <ellipse cx="128" cy="128" rx="98" ry="40" transform="rotate(60 128 128)" stroke="#38d9e8" stroke-width="14" />
  <ellipse cx="128" cy="128" rx="98" ry="40" transform="rotate(120 128 128)" stroke="#38d9e8" stroke-width="14" />
  <!-- Symmetric Orbital Energy Nodes -->
  <circle cx="226" cy="128" r="12" fill="#38d9e8" />
  <circle cx="30" cy="128" r="12" fill="#38d9e8" />
  <circle cx="79" cy="43" r="12" fill="#38d9e8" />
  <circle cx="177" cy="43" r="12" fill="#38d9e8" />
  <circle cx="79" cy="213" r="12" fill="#38d9e8" />
  <circle cx="177" cy="213" r="12" fill="#38d9e8" />
</svg>
