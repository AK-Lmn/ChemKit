<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"><title>ChemKit Brand Symbol</title><g transform="translate(2.94 2.94) scale(0.977)" fill="none">
  
  <!-- Central Carbon Nucleus -->
  <circle cx="128" cy="128" r="28" fill="#000000" />
  <!-- Three Orbital Ellipses rotated at 0, 60, 120 deg -->
  <ellipse cx="128" cy="128" rx="98" ry="40" stroke="#000000" stroke-width="14" />
  <ellipse cx="128" cy="128" rx="98" ry="40" transform="rotate(60 128 128)" stroke="#000000" stroke-width="14" />
  <ellipse cx="128" cy="128" rx="98" ry="40" transform="rotate(120 128 128)" stroke="#000000" stroke-width="14" />
  <!-- Symmetric Orbital Energy Nodes -->
  <circle cx="226" cy="128" r="12" fill="#000000" />
  <circle cx="30" cy="128" r="12" fill="#000000" />
  <circle cx="79" cy="43" r="12" fill="#000000" />
  <circle cx="177" cy="43" r="12" fill="#000000" />
  <circle cx="79" cy="213" r="12" fill="#000000" />
  <circle cx="177" cy="213" r="12" fill="#000000" />
</g></svg>